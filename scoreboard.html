<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ping-Pong Scorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:       #00e676;
      --green-dim:   rgba(0,230,118,0.10);
      --green-glow:  rgba(0,230,118,0.5);
      --blue:        #40c4ff;
      --blue-dim:    rgba(64,196,255,0.10);
      --blue-glow:   rgba(64,196,255,0.5);
      --gold:        #ffd740;
      --bg:          #06080b;
      --line:        rgba(255,255,255,0.06);
      --muted:       rgba(255,255,255,0.35);
      --mid:         rgba(255,255,255,0.6);
      --font-score:  'Bebas Neue', sans-serif;
      --font-ui:     'Barlow Condensed', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      width: 100vw; height: 100vh;
      display: grid;
      grid-template-columns: 38vw 1fr;
      position: relative;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3vh;
      background: var(--bg);
      transition: opacity 0.35s ease;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    .ov-icon { font-size: clamp(3rem,7vw,6rem); animation: spin 4s linear infinite; }
    .ov-icon.still { animation: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ov-title {
      font-family: var(--font-score);
      font-size: clamp(2.5rem,7vw,6rem);
      letter-spacing: 0.04em; text-align: center;
    }
    .ov-sub {
      font-size: clamp(1rem,2.2vw,1.8rem); font-weight: 300;
      letter-spacing: 0.08em; color: var(--mid);
      text-align: center; max-width: 65vw; line-height: 1.6;
    }

    .choice-row { display: flex; gap: 3vw; margin-top: 1vh; }
    .choice-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 1.2vh;
      padding: 2.5vh 3.5vw;
      border-radius: 1rem; border: 1.5px solid; min-width: 16vw;
    }
    .choice-card.g { border-color: var(--green); background: var(--green-dim); }
    .choice-card.b { border-color: var(--blue);  background: var(--blue-dim);  }
    .c-btn { font-size: clamp(0.65rem,1.3vw,1rem); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    .c-btn.g { color: var(--green); }
    .c-btn.b { color: var(--blue);  }
    .c-val { font-family: var(--font-score); font-size: clamp(1.6rem,3.5vw,3rem); letter-spacing: 0.05em; }

    .conn-row { display: flex; gap: 2.5vw; }
    .cdot-wrap { display: flex; align-items: center; gap: 0.7em; font-size: clamp(0.8rem,1.5vw,1.1rem); color: var(--muted); font-weight: 600; letter-spacing: 0.1em; }
    .cdot { width: 0.85em; height: 0.85em; border-radius: 50%; background: #1a1a1a; border: 1.5px solid #333; transition: background 0.4s, box-shadow 0.4s; }
    .cdot.on.g { background: var(--green); border-color: var(--green); box-shadow: 0 0 10px var(--green-glow); }
    .cdot.on.b { background: var(--blue);  border-color: var(--blue);  box-shadow: 0 0 10px var(--blue-glow);  }

    .winner-name { font-family: var(--font-score); font-size: clamp(4rem,10vw,9rem); letter-spacing: 0.04em; animation: winPop 0.7s cubic-bezier(0.22,1,0.36,1) both; }
    .winner-name.g { color: var(--green); text-shadow: 0 0 60px var(--green-glow); }
    .winner-name.b { color: var(--blue);  text-shadow: 0 0 60px var(--blue-glow);  }
    @keyframes winPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .history-row { display: flex; gap: 0.8em; flex-wrap: wrap; justify-content: center; }
    .hchip { font-weight: 600; font-size: clamp(0.75rem,1.4vw,1.1rem); letter-spacing: 0.06em; padding: 0.3em 1em; border-radius: 100px; border: 1.5px solid; }
    .hchip.g { border-color: var(--green); color: var(--green); background: var(--green-dim); }
    .hchip.b { border-color: var(--blue);  color: var(--blue);  background: var(--blue-dim);  }

    #ov-msg { position: absolute; bottom: 3vh; font-size: clamp(0.7rem,1.2vw,0.9rem); color: var(--muted); letter-spacing: 0.1em; }

    #left-col {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      border-right: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .player-panel {
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: center;
      padding: 0 0 0 3.5vw;
      position: relative; overflow: hidden;
      transition: background 0.5s;
    }

    .player-panel::before {
      content: ''; position: absolute; inset: 0;
      opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }
    #top-panel::before    { background: radial-gradient(ellipse at 0% 50%, var(--green-dim) 0%, transparent 70%); }
    #bot-panel::before    { background: radial-gradient(ellipse at 0% 50%, var(--blue-dim)  0%, transparent 70%); }
    .player-panel.serving::before { opacity: 1; }

    .player-panel::after {
      content: ''; position: absolute;
      left: 0; top: 15%; bottom: 15%; width: 4px;
      border-radius: 0 2px 2px 0;
      opacity: 0; transition: opacity 0.4s;
    }
    #top-panel::after    { background: var(--green); box-shadow: 0 0 14px var(--green-glow); }
    #bot-panel::after    { background: var(--blue);  box-shadow: 0 0 14px var(--blue-glow);  }
    .player-panel.serving::after { opacity: 1; }

    .p-label { font-size: clamp(0.65rem,1.3vw,1rem); font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 0.2em; display: flex; align-items: center; gap: 0.6em; }
    #top-panel .p-label { color: var(--green); }
    #bot-panel .p-label { color: var(--blue);  }

    .p-dot { width: 0.6em; height: 0.6em; border-radius: 50%; }
    #top-panel .p-dot { background: var(--green); }
    #bot-panel .p-dot { background: var(--blue);  }

    .p-score {
      font-family: var(--font-score);
      font-size: clamp(7rem, 20vw, 17rem);
      line-height: 0.85; letter-spacing: -0.02em;
      padding-left: 4vw;
    }
    #top-panel .p-score { color: var(--green); }
    #bot-panel .p-score { color: var(--blue);  }

    @keyframes scorePop { 0%{transform:scale(1)} 35%{transform:scale(1.1)} 100%{transform:scale(1)} }
    .p-score.pop { animation: scorePop 0.3s cubic-bezier(0.22,1,0.36,1) forwards; }

    .p-games { display: flex; align-items: center; gap: 0.5em; margin-top: 0.5em; }
    .p-games-lbl { font-size: clamp(0.55rem,1.1vw,0.8rem); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-right: 0.3em; }
    .p-pip { width: clamp(0.5rem,1.1vw,0.85rem); height: clamp(0.5rem,1.1vw,0.85rem); border-radius: 50%; border: 1.5px solid; transition: background 0.35s, box-shadow 0.35s; }
    #top-panel .p-pip     { border-color: var(--green); }
    #bot-panel .p-pip     { border-color: var(--blue);  }
    #top-panel .p-pip.won { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
    #bot-panel .p-pip.won { background: var(--blue);  box-shadow: 0 0 6px var(--blue-glow);  }

    .serve-badge {
      display: flex; align-items: center; gap: 0.5em; margin-top: 0.7em;
      padding: 0.35em 0.9em; border-radius: 100px;
      font-size: clamp(0.55rem,1.05vw,0.8rem); font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      opacity: 0; transform: translateX(-8px);
      transition: opacity 0.35s, transform 0.35s;
    }
    #top-panel .serve-badge { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    #bot-panel .serve-badge { background: var(--blue-dim);  color: var(--blue);  border: 1px solid var(--blue);  }
    .player-panel.serving .serve-badge { opacity: 1; transform: translateX(0); }

    .serve-blink { width: 0.45em; height: 0.45em; border-radius: 50%; animation: blink 0.9s ease-in-out infinite; }
    #top-panel .serve-blink { background: var(--green); }
    #bot-panel .serve-blink { background: var(--blue);  }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

    #center-strip {
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: center;
      padding: 0.8vh 0 0.8vh 3.5vw; gap: 0.25em;
      position: relative;
    }
    #center-strip::before, #center-strip::after {
      content: ''; position: absolute; left: 3.5vw; right: 2vw; height: 1px; background: var(--line);
    }
    #center-strip::before { top: 0; }
    #center-strip::after  { bottom: 0; }

    .strip-game { font-family: var(--font-score); font-size: clamp(2rem,4vw,3.2rem); letter-spacing: 0.12em; color: var(--gold); }
    .strip-meta { font-size: clamp(1.2rem,2.2vw,1.7rem); font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
    .strip-pips { display: flex; gap: 0.6em; margin-top: 0.3em; }
    .strip-pip  { width: 1.5em; height: 1.5em; border-radius: 50%; background: #1a1a1a; transition: background 0.4s, box-shadow 0.4s; }
    .strip-pip.done { background: rgba(255,255,255,0.35); }
    .strip-pip.now  { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

    #serve-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 0.5em;
      padding: 0.6vh 3.5vw;
      background: rgba(0,0,0,0.25);
      border-top: 1px solid var(--line);
    }
    .sc-lbl { font-size: clamp(1rem,1.8vw,1.4rem); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-right: 0.3em; }
    .sc-pip { width: 1.1em; height: 1.1em; border-radius: 50%; background: #1a1a1a; border: 1px solid #333; transition: background 0.3s, box-shadow 0.3s; }
    .sc-pip.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }

    #right-col {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    #table-svg { width: 100%; height: 100%; display: block; }

    @keyframes ballPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #ball-near, #ball-far { transition: opacity 0.5s ease; }
    #ball-near.on, #ball-far.on { animation: ballPulse 1.1s ease-in-out infinite; }

    #toast {
      position: fixed; bottom: 2.5vh; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.06); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 100px;
      padding: 0.5em 2em; font-size: clamp(0.6rem,1.1vw,0.8rem); font-weight: 600;
      letter-spacing: 0.1em; color: var(--muted);
      white-space: nowrap; max-width: 80vw; overflow: hidden; text-overflow: ellipsis;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99;
    }
    #toast.show { opacity: 1; }

    #sim { position: fixed; top: 1vh; right: 1vw; display: none; flex-wrap: wrap; gap: 0.4em; max-width: 25vw; z-index: 200; }
    #sim.show { display: flex; }
    .sb { padding: 0.35em 0.7em; border: none; border-radius: 0.4rem; font-family: var(--font-ui); font-size: 0.7rem; font-weight: 700; cursor: pointer; letter-spacing: 0.06em; }
    .sb.g { background: #004d1a; color: var(--green); }
    .sb.b { background: #003366; color: var(--blue); }
    .sb.r { background: #222; color: #888; }

    /* ── Battery indicators ─────────────────────────────────────────── */
    .bat-wrap {
      display: flex; align-items: center; gap: 0.4em;
      margin-top: 0.5em;
      font-size: clamp(0.6rem, 1.1vw, 0.85rem);
      font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .bat-icon {
      width: 1.8em; height: 0.9em;
      border: 1.5px solid;
      border-radius: 2px;
      position: relative;
      display: flex; align-items: center;
    }
    .bat-icon::after {
      content: '';
      position: absolute; right: -5px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 0.45em;
      border-radius: 0 1px 1px 0;
    }
    .bat-fill {
      height: 100%;
      border-radius: 1px;
      transition: width 0.5s ease;
    }
    #top-panel .bat-icon  { border-color: var(--green); }
    #top-panel .bat-icon::after { background: var(--green); }
    #top-panel .bat-fill  { background: var(--green); }
    #bot-panel .bat-icon  { border-color: var(--blue); }
    #bot-panel .bat-icon::after { background: var(--blue); }
    #bot-panel .bat-fill  { background: var(--blue); }

    .bat-wrap.low .bat-fill { background: #ff5252 !important; }
    .bat-wrap.low .bat-icon { border-color: #ff5252 !important; }
    .bat-wrap.low .bat-icon::after { background: #ff5252 !important; }
    .bat-wrap.low .bat-pct { color: #ff5252; }
    @keyframes batFlash { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .bat-wrap.low { animation: batFlash 1s ease-in-out infinite; }

    .bat-wrap.unknown { opacity: 0.3; }

    /* ── Loss of signal overlay ─────────────────────────────────────── */
    #signal-lost {
      position: fixed; inset: 0; z-index: 80;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2vh;
      background: rgba(6, 8, 11, 0.92);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #signal-lost.show { opacity: 1; pointer-events: all; }
    .sl-icon { font-size: clamp(3rem,8vw,6rem); }
    .sl-title {
      font-family: var(--font-score);
      font-size: clamp(2rem,6vw,5rem);
      letter-spacing: 0.08em;
      color: #ff5252;
    }
    .sl-sub {
      font-size: clamp(0.9rem,2vw,1.5rem);
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    @keyframes slPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .sl-icon { animation: slPulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
<div id="app">

  <!-- OVERLAY -->
  <div id="overlay">
    <div class="ov-icon still" id="ov-icon">🏓</div>
    <div class="ov-title" id="ov-title">PING PONG SCORER</div>
    <div class="ov-sub"   id="ov-sub">Connecting…</div>
    <div id="ov-choices" style="display:none"></div>
    <div id="ov-conn"    style="display:none" class="conn-row">
      <div class="cdot-wrap"><div class="cdot g" id="dot-g"></div><span>GREEN</span></div>
      <div class="cdot-wrap"><div class="cdot b" id="dot-b"></div><span>BLUE</span></div>
    </div>
    <div id="ov-msg"></div>
  </div>

  <!-- LEFT COLUMN -->
  <div id="left-col">
    <div class="player-panel" id="top-panel">
      <div class="p-label"><div class="p-dot"></div><span>GREEN</span></div>
      <div class="p-score" id="top-score">0</div>
      <div class="p-games" id="top-games"></div>
      <div class="serve-badge"><div class="serve-blink"></div><span>SERVING</span></div>
      <div class="bat-wrap" id="top-bat">
        <div class="bat-icon"><div class="bat-fill" id="top-bat-fill" style="width:100%"></div></div>
        <span class="bat-pct" id="top-bat-pct">—</span>
      </div>
    </div>

    <div id="center-strip">
      <div class="strip-game" id="strip-game">GAME 1</div>
      <div class="strip-meta" id="strip-meta">RACE TO 11 · BEST OF 3</div>
      <div class="strip-pips" id="strip-pips"></div>
    </div>

    <div class="player-panel" id="bot-panel">
      <div class="p-label"><div class="p-dot"></div><span>BLUE</span></div>
      <div class="p-score" id="bot-score">0</div>
      <div class="p-games" id="bot-games"></div>
      <div class="serve-badge"><div class="serve-blink"></div><span>SERVING</span></div>
      <div class="bat-wrap" id="bot-bat">
        <div class="bat-icon"><div class="bat-fill" id="bot-bat-fill" style="width:100%"></div></div>
        <span class="bat-pct" id="bot-bat-pct">—</span>
      </div>
    </div>

    <div id="serve-bar">
      <span class="sc-lbl">SERVE</span>
      <div class="sc-pip" id="sc1"></div>
      <div class="sc-pip" id="sc2"></div>
    </div>
  </div>

  <!-- RIGHT COLUMN — TABLE SVG
  ═══════════════════════════════════════════════════════════════════
  TABLE GEOMETRY  (all straight lines — true trapezoid, no curves)
  ───────────────────────────────────────────────────────────────────
  Near end (foreground):  y=708,  x: 55  → 645   (width 590)
  Net line on surface:    y=400,  x: 190 → 510   (width 320)
  Far end (background):   y=152,  x: 270 → 430   (width 160)

  Left side:  straight line 55,708 → 270,152
  Right side: straight line 645,708 → 430,152

  NET
  ───
  Sits ON the table surface at y=400.
  Top of net: y=370  (30px above table surface — perspective-scaled)
  Extends past both table edges:
    Left post:  x=165  (25px left of table edge x=190)
    Right post: x=535  (25px right of table edge x=510)
  ═══════════════════════════════════════════════════════════════════ -->
  <div id="right-col">
    <svg id="table-svg" viewBox="0 0 700 800"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="arenaGrad" cx="50%" cy="55%" r="65%">
          <stop offset="0%"   stop-color="#0f1520"/>
          <stop offset="100%" stop-color="#06080b"/>
        </radialGradient>
        <linearGradient id="nearGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#1565c0"/>
          <stop offset="100%" stop-color="#1e88e5"/>
        </linearGradient>
        <linearGradient id="farGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#0a3880"/>
          <stop offset="100%" stop-color="#1565c0"/>
        </linearGradient>
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#1a237e"/>
          <stop offset="100%" stop-color="#06080b"/>
        </linearGradient>
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#111820"/>
          <stop offset="100%" stop-color="#06080b"/>
        </linearGradient>
        <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#00e676" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#40c4ff" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#40c4ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ballCore" cx="32%" cy="32%" r="60%">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#cce5f5"/>
        </radialGradient>
        <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="shadow">
          <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.8"/>
        </filter>
      </defs>

      <!-- Arena background -->
      <rect width="700" height="800" fill="url(#arenaGrad)"/>

      <!-- Floor below near end -->
      <polygon points="0,728 700,728 700,800 0,800" fill="url(#floorGrad)"/>
      <line x1="0" y1="728" x2="700" y2="728" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

      <!-- ── TABLE ─────────────────────────────────────────────────────────
           Straight-sided trapezoid. No curves anywhere.
           Near end:  55,708 → 645,708
           Far end:  270,152 → 430,152
           Left side:  55,708 → 270,152   (straight)
           Right side: 645,708 → 430,152  (straight)
           Net line sits at y=400: 190,400 → 510,400
      ──────────────────────────────────────────────────────────────────── -->

      <!-- Table shadow -->
      <polygon points="55,718 645,718 430,152 270,152"
               fill="rgba(0,0,0,0.45)" filter="url(#shadow)"/>

      <!-- Full table surface — single trapezoid, straight sides -->
      <polygon points="55,708 645,708 430,152 270,152" fill="url(#farGrad)"/>

      <!-- ── White boundary lines ──────────────────────────────────────── -->
      <!-- Near end -->
      <line x1="55"  y1="708" x2="645" y2="708" stroke="white" stroke-width="3"   opacity="0.9"/>
      <!-- Far end -->
      <line x1="270" y1="152" x2="430" y2="152" stroke="white" stroke-width="1.5" opacity="0.75"/>
      <!-- Left side — straight -->
      <line x1="55"  y1="708" x2="270" y2="152" stroke="white" stroke-width="2"   opacity="0.8"/>
      <!-- Right side — straight -->
      <line x1="645" y1="708" x2="430" y2="152" stroke="white" stroke-width="2"   opacity="0.8"/>
      <!-- Center line -->

      <!-- Near ball -->
      <g id="ball-near" opacity="0">
        <circle cx="350" cy="570" r="50" fill="url(#glowGreen)"/>
        <circle cx="350" cy="570" r="16" fill="url(#ballCore)" filter="url(#softGlow)"/>

      <!-- Far ball -->

<!-- Loss of signal overlay -->
<div id="signal-lost">
  <div class="sl-icon">📡</div>
  <div class="sl-title">SIGNAL LOST</div>
  <div class="sl-sub">Waiting for server…</div>
</div>
<div id="toast"></div>

<!-- Sim panel (press S to toggle) -->
<div id="sim">
  <button class="sb g" onclick="sim('green','short')">G Short</button>
  <button class="sb g" onclick="sim('green','double')">G Double</button>
  <button class="sb g" onclick="sim('green','reset')">G Reset</button>
  <button class="sb b" onclick="sim('blue','short')">B Short</button>
  <button class="sb b" onclick="sim('blue','double')">B Double</button>
  <button class="sb b" onclick="sim('blue','reset')">B Reset</button>
  <button class="sb r" onclick="simConnect()">Connect Both</button>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  MODE DETECTION — server-connected vs standalone simulation
// ══════════════════════════════════════════════════════════════════════════════
let socketConnected = false;
const socket = io({ reconnectionAttempts: 10, timeout: 2000 });

// ── DOM refs ──────────────────────────────────────────────────────────────────
const overlay    = document.getElementById('overlay');
const ovIcon     = document.getElementById('ov-icon');
const ovTitle    = document.getElementById('ov-title');
const ovSub      = document.getElementById('ov-sub');
const ovChoices  = document.getElementById('ov-choices');
const ovConn     = document.getElementById('ov-conn');
const ovMsg      = document.getElementById('ov-msg');
const topPanel   = document.getElementById('top-panel');
const botPanel   = document.getElementById('bot-panel');
const topScore   = document.getElementById('top-score');
const botScore   = document.getElementById('bot-score');
const topGames   = document.getElementById('top-games');
const botGames   = document.getElementById('bot-games');
const stripGame  = document.getElementById('strip-game');
const stripMeta  = document.getElementById('strip-meta');
const stripPips  = document.getElementById('strip-pips');
const ballNear   = document.getElementById('ball-near');
const ballFar    = document.getElementById('ball-far');
const sc1        = document.getElementById('sc1');
const sc2        = document.getElementById('sc2');
const toast      = document.getElementById('toast');
const simPanel   = document.getElementById('sim');
const sigLost    = document.getElementById('signal-lost');
const topBat     = document.getElementById('top-bat');
const botBat     = document.getElementById('bot-bat');
const topBatFill = document.getElementById('top-bat-fill');
const botBatFill = document.getElementById('bot-bat-fill');
const topBatPct  = document.getElementById('top-bat-pct');
const botBatPct  = document.getElementById('bot-bat-pct');

let toastTimer   = null;
let sigLostTimer = null;

// ══════════════════════════════════════════════════════════════════════════════
//  LOSS OF SIGNAL
// ══════════════════════════════════════════════════════════════════════════════
const SIGNAL_TIMEOUT_MS = 4000;

function resetSignalTimer() {
  sigLost.classList.remove('show');
  clearTimeout(sigLostTimer);
  if (socketConnected) {
    sigLostTimer = setTimeout(() => sigLost.classList.add('show'), SIGNAL_TIMEOUT_MS);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
//  BATTERY DISPLAY
// ══════════════════════════════════════════════════════════════════════════════
function updateBattery(fillEl, pctEl, wrapEl, pct) {
  if (pct < 0) {
    wrapEl.className = 'bat-wrap unknown';
    pctEl.textContent = '—';
    fillEl.style.width = '100%';
    return;
  }
  fillEl.style.width = Math.max(pct, 3) + '%';
  pctEl.textContent  = pct + '%';
  wrapEl.className   = 'bat-wrap' + (pct <= 25 ? ' low' : '');
}

// ══════════════════════════════════════════════════════════════════════════════
//  LOCAL GAME ENGINE (standalone simulation mode)
// ══════════════════════════════════════════════════════════════════════════════

const ST = {
  WAITING_BUTTONS: 'WAITING_BUTTONS', RULE_RACE: 'RULE_RACE',
  RULE_BO: 'RULE_BO', SERVING_CHOICE: 'SERVING_CHOICE',
  PLAYING: 'PLAYING', WIN_CONFIRM: 'WIN_CONFIRM', MATCH_OVER: 'MATCH_OVER',
};

function freshState() {
  return {
    state: ST.WAITING_BUTTONS, race_to: 11, best_of: 3,
    games_won: {left:0, right:0}, current_game: 1,
    score: {left:0, right:0}, server: 'left',
    serve_count: 1, serve_num: 0, extend_prompt: false,
    game_winner: null, game_history: [],
    connected: {green:false, blue:false},
    battery: {green:-1, blue:-1},
    heartbeat: {green:true, blue:true},
    message: '',
  };
}

let LGS = freshState(), undoStack = [];
const clone  = o => JSON.parse(JSON.stringify(o));
const side   = c => c === 'green' ? 'left' : 'right';
const colour = s => s === 'left' ? 'green' : 'blue';

function pushUndo() { undoStack.push(clone(LGS)); }
function popUndo()  { if (undoStack.length) { LGS = undoStack.pop(); return true; } return false; }

function advanceServe(gs) {
  gs.serve_num++;
  if (gs.serve_count === 1) { gs.serve_count = 2; return false; }
  gs.serve_count = 1; gs.server = gs.server === 'left' ? 'right' : 'left';
  return true;
}
function applyPoint(gs, s) { gs.score[s]++; return advanceServe(gs); }
function checkGameWin(gs) {
  const l = gs.score.left, r = gs.score.right;
  if ((l >= gs.race_to || r >= gs.race_to) && Math.abs(l-r) >= 2) return l > r ? 'left' : 'right';
  return null;
}
function matchWinner(gs) {
  const need = Math.floor(gs.best_of/2)+1;
  if (gs.games_won.left  >= need) return 'left';
  if (gs.games_won.right >= need) return 'right';
  return null;
}
function swapGamesWon(gs) {
  [gs.games_won.left, gs.games_won.right] = [gs.games_won.right, gs.games_won.left];
}
function startNewGame(gs, ws) {
  gs.server = ws === 'left' ? 'right' : 'left';
  swapGamesWon(gs); gs.score = {left:0,right:0};
  gs.current_game++; gs.serve_count = 1;
}

function localPush(msg='') {
  LGS.message = msg;
  const s = clone(LGS);
  if (s.state === ST.PLAYING) { overlay.classList.add('hidden'); renderBoard(s); }
  else { overlay.classList.remove('hidden'); renderOverlay(s); }
  if (msg) showToast(msg);
}

function localButton(col, press) {
  if (press === 'reset') {
    // quad-press → clean reset, skip to RULE_RACE
    const old = {connected: clone(LGS.connected), battery: clone(LGS.battery), heartbeat: clone(LGS.heartbeat)};
    LGS = freshState(); undoStack = [];
    LGS.connected = old.connected; LGS.battery = old.battery; LGS.heartbeat = old.heartbeat;
    LGS.state = ST.RULE_RACE;
    localPush('Reset! Choose game length.');
    return;
  }
  if (press === 'double') {
    if (!undoStack.length) { localPush('Nothing to undo.'); return; }
    popUndo(); localPush('⟵ Point undone.');
    return;
  }
  const gs = LGS;
  switch (gs.state) {
    case ST.WAITING_BUTTONS: break;
    case ST.RULE_RACE:
      pushUndo(); gs.race_to = col==='green'?11:21; gs.state = ST.RULE_BO;
      localPush(`Race to ${gs.race_to}. Choose best of.`); break;
    case ST.RULE_BO:
      pushUndo(); gs.best_of = col==='green'?3:5; gs.state = ST.SERVING_CHOICE;
      localPush(`Best of ${gs.best_of}. Who serves first?`); break;
    case ST.SERVING_CHOICE:
      pushUndo(); gs.server = side(col); gs.serve_count = 1; gs.serve_num = 1;
      gs.state = ST.PLAYING; localPush(`${col.toUpperCase()} serves first!`); break;
    case ST.PLAYING:   localScore(col); break;
    case ST.WIN_CONFIRM: localWinConfirm(col); break;
    case ST.MATCH_OVER: localPush('Quad-press to start a new match.'); break;
  }
}

function localScore(col) {
  const gs = LGS; pushUndo(); applyPoint(gs, side(col));
  const w = checkGameWin(gs);
  if (w) { localGameWin(w); return; }
  localPush(`${col.toUpperCase()} scores!  ${gs.score.left}–${gs.score.right}`);
}

function localGameWin(ws) {
  const gs = LGS; const wc = colour(ws); const gn = gs.current_game;
  gs.game_history.push({left:gs.score.left,right:gs.score.right,winner_side:ws,winner_colour:wc});
  gs.games_won[ws]++; gs.game_winner = ws;
  const mw = matchWinner(gs);
  if (mw && gs.best_of===3) {
    gs.state = ST.WIN_CONFIRM; gs.extend_prompt = true;
    localPush(`${wc.toUpperCase()} wins game ${gn}! Extend to best of 5?`); return;
  }
  if (mw) { gs.state = ST.MATCH_OVER; localPush(`${wc.toUpperCase()} wins the match!`); return; }
  startNewGame(gs, ws); gs.state = ST.PLAYING;
  localPush(`${wc.toUpperCase()} wins game ${gn}! Game ${gs.current_game} starting…`);
}

function localWinConfirm(col) {
  const gs = LGS;
  if (col==='blue') {
    const old = {connected:clone(LGS.connected),battery:clone(LGS.battery),heartbeat:clone(LGS.heartbeat)};
    LGS = freshState(); undoStack = [];
    LGS.connected = old.connected; LGS.battery = old.battery; LGS.heartbeat = old.heartbeat;
    LGS.state = ST.RULE_RACE; localPush('New match! Choose game length.'); return;
  }
  pushUndo(); const ws = gs.game_winner; gs.best_of = 5; gs.extend_prompt = false;
  startNewGame(gs, ws); gs.state = ST.PLAYING; localPush('Extended to best of 5!');
}

function localConnect() {
  LGS.connected.green = true; LGS.connected.blue = true;
  LGS.heartbeat.green = true; LGS.heartbeat.blue = true;
  LGS.state = ST.RULE_RACE;
  localPush('Both buttons connected! Choose game length.');
}

// ══════════════════════════════════════════════════════════════════════════════
//  RENDERING
// ══════════════════════════════════════════════════════════════════════════════

function renderBoard(s) {
  animScore(topScore, s.score.left);
  animScore(botScore, s.score.right);
  renderGames(topGames, s.games_won.left,  s.best_of);
  renderGames(botGames, s.games_won.right, s.best_of);

  const topServes = s.server === 'left';
  topPanel.classList.toggle('serving',  topServes);
  botPanel.classList.toggle('serving', !topServes);

  // GREEN (top) = far end; BLUE (bot) = near end
  if (topServes) {
    ballFar.style.opacity  = '1'; ballFar.classList.add('on');
    ballNear.style.opacity = '0'; ballNear.classList.remove('on');
  } else {
    ballNear.style.opacity = '1'; ballNear.classList.add('on');
    ballFar.style.opacity  = '0'; ballFar.classList.remove('on');
  }

  sc1.classList.toggle('on', s.serve_count >= 1);
  sc2.classList.toggle('on', s.serve_count >= 2);

  stripGame.textContent = `GAME ${s.current_game}`;
  stripMeta.textContent = `RACE TO ${s.race_to} · BEST OF ${s.best_of}`;

  stripPips.innerHTML = '';
  for (let i = 0; i < s.best_of; i++) {
    const p = document.createElement('div');
    p.className = 'strip-pip' +
      (i < s.current_game-1 ? ' done' : i === s.current_game-1 ? ' now' : '');
    stripPips.appendChild(p);
  }

  // Battery
  const bat = s.battery || {green:-1, blue:-1};
  updateBattery(topBatFill, topBatPct, topBat, bat.green ?? -1);
  updateBattery(botBatFill, botBatPct, botBat, bat.blue  ?? -1);

  // Connection dots (heartbeat-based)
  const hb = s.heartbeat || {green:true, blue:true};
  document.getElementById('dot-g').className = 'cdot g' + (hb.green ? ' on' : '');
  document.getElementById('dot-b').className = 'cdot b' + (hb.blue  ? ' on' : '');
}

function animScore(el, val) {
  if (parseInt(el.textContent) !== val) {
    el.textContent = val;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    el.addEventListener('animationend', () => el.classList.remove('pop'), {once:true});
  }
}

function renderGames(container, won, bestOf) {
  const needed = Math.floor(bestOf/2)+1;
  container.innerHTML = `<span class="p-games-lbl">GAMES</span>`;
  for (let i = 0; i < needed; i++) {
    const p = document.createElement('div');
    p.className = 'p-pip' + (i < won ? ' won' : '');
    container.appendChild(p);
  }
}

function renderOverlay(s) {
  ovChoices.style.display = 'none'; ovConn.style.display = 'none';
  ovIcon.className = 'ov-icon still'; ovMsg.textContent = '';

  switch (s.state) {
    case 'WAITING_BUTTONS':
      ovIcon.className = 'ov-icon';
      ovTitle.textContent = 'PING PONG SCORER';
      ovSub.textContent   = 'Waiting for buttons to connect…';
      ovConn.style.display = 'flex';
      document.getElementById('dot-g').className = 'cdot g' + (s.connected?.green ? ' on' : '');
      document.getElementById('dot-b').className = 'cdot b' + (s.connected?.blue  ? ' on' : '');
      break;
    case 'RULE_RACE':
      ovTitle.textContent = 'CHOOSE GAME LENGTH';
      ovSub.textContent   = 'Tap your button to select.';
      choices([{c:'g',btn:'GREEN BUTTON',val:'RACE TO 11'},{c:'b',btn:'BLUE BUTTON',val:'RACE TO 21'}]);
      break;
    case 'RULE_BO':
      ovTitle.textContent = `RACE TO ${s.race_to} — BEST OF?`;
      ovSub.textContent   = 'How many games in the match?';
      choices([{c:'g',btn:'GREEN BUTTON',val:'BEST OF 3'},{c:'b',btn:'BLUE BUTTON',val:'BEST OF 5'}]);
      break;
    case 'SERVING_CHOICE':
      ovTitle.textContent = 'WHO SERVES FIRST?';
      ovSub.textContent   = 'Tap your button to claim first serve.';
      choices([{c:'g',btn:'GREEN BUTTON',val:'TOP PLAYER SERVES'},{c:'b',btn:'BLUE BUTTON',val:'BOTTOM PLAYER SERVES'}]);
      break;
    case 'WIN_CONFIRM': {
      const wc = s.game_winner==='left'?'g':'b', wn = wc==='g'?'GREEN':'BLUE';
      ovTitle.innerHTML = `<span class="winner-name ${wc}">${wn} WINS!</span>`;
      ovSub.innerHTML   = `Best of 3 complete.<br>Continue to best of 5?`;
      choices([{c:'g',btn:'GREEN BUTTON',val:'PLAY BEST OF 5'},{c:'b',btn:'BLUE BUTTON',val:'NEW MATCH'}]);
      break;
    }
    case 'MATCH_OVER': {
      const wc = s.game_winner==='left'?'g':'b', wn = wc==='g'?'GREEN':'BLUE';
      ovTitle.innerHTML = `<span class="winner-name ${wc}">🏆 ${wn} WINS!</span>`;
      ovSub.textContent = `Games — Top: ${s.games_won.left}  ·  Bottom: ${s.games_won.right}`;
      if (s.game_history?.length) {
        ovChoices.style.display = 'flex';
        ovChoices.innerHTML = `<div class="history-row">` +
          s.game_history.map((g,i) =>
            `<div class="hchip ${g.winner_colour==='green'?'g':'b'}">G${i+1}: ${g.left}–${g.right}</div>`
          ).join('') + `</div>`;
      }
      ovMsg.textContent = 'Quad-press either button to start a new match.';
      break;
    }
  }
}

function choices(items) {
  ovChoices.style.display = 'flex';
  ovChoices.innerHTML = items.map(i =>
    `<div class="choice-card ${i.c}">
       <div class="c-btn ${i.c}">${i.btn}</div>
       <div class="c-val">${i.val}</div>
     </div>`).join('');
}

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
}

// ══════════════════════════════════════════════════════════════════════════════
//  SIMULATION
// ══════════════════════════════════════════════════════════════════════════════

function sim(col, press) {
  if (socketConnected) socket.emit('sim_button', {colour:col, press});
  else localButton(col, press);
}
function simConnect() {
  if (socketConnected) {
    socket.emit('sim_button', {colour:'green', press:'short'});
    setTimeout(() => socket.emit('sim_button', {colour:'blue', press:'short'}), 120);
  } else { localConnect(); }
}

// ══════════════════════════════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key==='s'||e.key==='S') { simPanel.classList.toggle('show'); return; }
  if (e.key==='f'||e.key==='F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen(); return;
  }
  if (e.key==='g' && !e.ctrlKey) { sim('green','short');  return; }
  if (e.key==='G' && !e.ctrlKey) { sim('green','double'); return; }
  if (e.key==='b' && !e.ctrlKey) { sim('blue', 'short');  return; }
  if (e.key==='B' && !e.ctrlKey) { sim('blue', 'double'); return; }
  if (e.key==='r' || e.key==='R') { sim('green','reset');  return; }
  if (e.key==='c' || e.key==='C') { simConnect();          return; }
});

// ══════════════════════════════════════════════════════════════════════════════
//  SOCKET.IO — server mode
// ══════════════════════════════════════════════════════════════════════════════

socket.on('connect', () => {
  socketConnected = true;
  sigLost.classList.remove('show');
  showToast('Connected to Pi server.');
});

socket.on('disconnect', () => {
  socketConnected = false;
  clearTimeout(sigLostTimer);
  sigLost.classList.add('show');
  showToast('⚠ Server disconnected.');
});

socket.on('state_update', (s) => {
  resetSignalTimer();
  if (s.state === 'PLAYING') { overlay.classList.add('hidden'); renderBoard(s); }
  else { overlay.classList.remove('hidden'); renderOverlay(s); }
  if (s.message) showToast(s.message);
});

// Standalone fallback
setTimeout(() => {
  if (!socketConnected) {
    showToast('No server — standalone simulation mode.');
    localPush('');
  }
}, 2000);
